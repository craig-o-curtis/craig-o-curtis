name: Build profile

# Regenerates the generated parts of the profile README: assets/*.svg (hero, function keys, project cards,
# git log, field guide, contribution city, chengyu), data/profile.json, and the README sections between
# `<!-- name:start/end -->` markers. Commits only when something changed. Commits made with the workflow's
# own token never trigger another run.
#
# Supply chain: GitHub-owned actions only, pinned to full commit SHAs (the comment names the release). The
# contribution graph comes from GitHub's GraphQL API with the workflow's own token; no third-party action.

on:
  schedule:
    # Daily, 05:17 UTC: npm's download counts for the previous day are in by then.
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies to install: Node runs the TypeScript directly.
      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit if anything changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'chore(profile): refresh generated assets'
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
