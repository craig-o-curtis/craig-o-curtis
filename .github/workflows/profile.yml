name: Build profile

# Regenerates the generated parts of the profile README: assets/*.svg (hero, project cards, contribution
# snake), data/profile.json, and the README sections between `<!-- name:start/end -->` markers. Commits
# only when something changed. Commits made with the workflow's own token never trigger another run.
#
# Supply chain: GitHub-owned actions pinned to full commit SHAs (the comment names the release). The one
# third-party action, Platane/snk, runs in its own job with read-only permissions and hands its SVGs over
# as an artifact, so it never shares a job with the token that can push.

on:
  schedule:
    # Daily, 05:17 UTC: npm's download counts for the previous day are in by then.
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "README.md"
      - "package.json"
      - ".github/workflows/profile.yml"

permissions:
  contents: read

concurrency:
  group: profile
  cancel-in-progress: false

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # The contribution graph as a snake, in run-cv's green-screen palette. The token only reads the
      # public contribution calendar.
      - uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3.5.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#00ff00&color_dots=#161b22,#003300,#006600,#00aa00,#00ff00
            dist/snake-light.svg?palette=github-light&color_snake=#0b5d1e&color_dots=#ebedf0,#c6e8c6,#7fc97f,#2e9d3e,#0b5d1e

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snake
          path: dist/*.svg
          retention-days: 1
          if-no-files-found: error

  build:
    needs: snake
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies to install: Node runs the TypeScript directly.
      - run: npm test

      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: snake
          path: assets

      - name: Commit if anything changed
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git add assets data README.md
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -q -m 'chore(profile): refresh generated assets'
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
