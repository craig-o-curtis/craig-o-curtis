name: CI

# The checks a pull request must pass: the tests, an offline build that renders every asset and README
# section from the committed snapshot (data/profile.json) with no network calls, and a look at every SVG in
# headless Chrome. That catches a broken renderer, a README whose markers went missing, or an SVG that won't
# parse or draws blank, before it reaches main, where profile.yml builds live.

on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # GitHub-owned actions only, pinned to full commit SHAs (see profile.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # No dependencies to install: Node runs the TypeScript directly.
      - run: npm test

      - run: npm run build:offline

      # Every SVG drawn twice in the runner's preinstalled Chrome: still (reduced motion) and settled (every
      # animation run to its end). Fails on one that doesn't parse or comes out blank; the PNGs are kept for
      # review either way.
      - run: npm run check:render

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: renders
          path: dist/render/*.png
          retention-days: 7
          if-no-files-found: ignore

      # Informational: the generated files main's next run would rewrite. A stale asset in a PR is not an
      # error, because profile.yml regenerates everything after the merge.
      - name: Generated files that differ from the snapshot build
        run: git status --short assets data README.md
