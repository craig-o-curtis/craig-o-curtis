<svg xmlns="http://www.w3.org/2000/svg" width="840" height="300" viewBox="0 0 840 300" role="img" aria-labelledby="title">
<title id="title">CRAIG CURTIS: Frontend Architect · Fullstack Developer · Chinese Linguist. AI-accelerated TypeScript tooling — building at @northguild</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; white-space: pre; }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }
  @keyframes type { from { transform: translateX(0); } to { transform: translateX(153.6px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes gone { to { opacity: 0; } }
  @keyframes flicker { 0% { opacity: 0; } 8% { opacity: .9; } 12% { opacity: .15; } 22% { opacity: 1; } 28% { opacity: .45; } 36%, 100% { opacity: 1; } }
  @keyframes scan { from { transform: translateY(-90px); } to { transform: translateY(300px); } }
  .typing { animation: type 1.20s steps(16) 0.5s both; }
  .cursor-1 { animation: gone .01s linear 2.05s both; }
  .blink { animation: blink 1s step-end infinite; }
  .l1 { animation: appear .01s linear 2.05s both; }
  .l2 { animation: flicker .9s linear 2.55s both; }
  .l3 { animation: appear .4s ease-out 3.25s both; }
  .l4 { animation: appear .4s ease-out 3.55s both; }
  .l5 { animation: appear .01s linear 3.95s both; }
  .scan { animation: scan 7s linear 1s infinite both; }
  @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .motion-only { display: none; }
}
</style>
<defs>
  <clipPath id="screen"><rect width="840" height="300" rx="14"/></clipPath>
  <pattern id="lines" width="4" height="3" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#000" opacity=".35"/></pattern>
  <radialGradient id="vignette" cx="50%" cy="50%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00ff00" stop-opacity="0"/><stop offset=".5" stop-color="#00ff00" stop-opacity=".07"/><stop offset="1" stop-color="#00ff00" stop-opacity="0"/></linearGradient>
  <filter id="glow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="2.4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<g clip-path="url(#screen)">
  <rect width="840" height="300" fill="#0d0d0d"/>
  <rect width="840" height="30" fill="#001a00"/>
  <text x="18" y="20" font-size="12" fill="#00a000" letter-spacing="1">RUN-CV 3270 ── SESSION 0001 ── NORTHGUILD SYS</text>
  <text x="822" y="20" font-size="12" fill="#00a000" text-anchor="end" letter-spacing="1">ONLINE <tspan class="blink" fill="#00ff00">●</tspan></text>

  <g filter="url(#glow)">
    <text x="28" y="70" font-size="16" fill="#00a000">$</text>
    <text x="47.2" y="70" font-size="16" fill="#00ff00" textLength="153.6" lengthAdjust="spacing">npx run-cv craig</text>
  </g>
  <rect class="typing motion-only" x="47.2" y="48" width="163.2" height="34" fill="#0d0d0d"/>
  <g class="cursor-1 motion-only"><g class="typing"><rect class="blink" x="47.2" y="56" width="9.6" height="18" fill="#00ff00"/></g></g>

  <g filter="url(#glow)">
    <text class="l1" x="28" y="100" font-size="14" fill="#00a000">  resolving profile 'craig' <tspan fill="#003300">................................</tspan> <tspan fill="#00ffff">OK</tspan></text>
    <text class="l2" x="28" y="160" font-size="46" font-weight="700" letter-spacing="7" fill="#00ff00">CRAIG CURTIS</text>
    <text class="l3" x="28" y="196" font-size="16" fill="#00ffff">Frontend Architect · Fullstack Developer · Chinese Linguist</text>
    <text class="l4" x="28" y="224" font-size="14" fill="#00a000">AI-accelerated TypeScript tooling — building at @northguild</text>
    <g class="l5"><text x="28" y="258" font-size="16" fill="#00a000">$</text><rect class="blink" x="47.2" y="244" width="9.6" height="18" fill="#00ff00"/></g>
  </g>

  <rect y="272" width="840" height="28" fill="#001a00"/>
  <text x="18" y="291" font-size="12" fill="#00ff00" letter-spacing="1">READY</text>
  <text x="420" y="291" font-size="12" fill="#00a000" text-anchor="middle" letter-spacing="1">F1=HELP   F3=EXIT   F12=RUN-CV</text>
  <text x="822" y="291" font-size="12" fill="#00a000" text-anchor="end" letter-spacing="1">INSERT</text>

  <rect class="scan motion-only" width="840" height="90" fill="url(#beam)"/>
  <rect width="840" height="300" fill="url(#lines)"/>
  <rect width="840" height="300" fill="url(#vignette)"/>
</g>
<rect x="1" y="1" width="838" height="298" rx="13" fill="none" stroke="#008000" stroke-width="2"/>
</svg>
