<title id="title">Pop quiz, over a city skyline in the purple rain: Craig is from the hometown of the artist who gave the world “Purple Rain.” Options: A, Detroit; B, Minneapolis; C, Chicago; D, Memphis. Pick one below; the answer is under them.</title>
<style>
  text { white-space: pre; }
  @keyframes appear { from { opacity: 0; } }
  @keyframes fall { from { transform: translate(0, 0); } to { transform: translate(-120px, 400px); } }
  @keyframes lock { from { opacity: 0; transform: scale(1.25); } 60% { opacity: 1; transform: scale(1); } 75% { opacity: .25; } to { opacity: 1; } }
  .rain { will-change: transform; animation: fall linear infinite; }
  .rain0 { animation-duration: 1.15s; }
  .rain1 { animation-duration: 2.1s; }
  .lights { animation: appear 1.6s ease-out .4s both; }
  .q { animation: appear .5s ease-out .2s both; }
  .lock { transform-box: fill-box; transform-origin: center; animation: lock .9s ease-out .5s both; }
  @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .motion-only { display: none; }
}
</style>
