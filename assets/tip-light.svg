<svg xmlns="http://www.w3.org/2000/svg" width="852" height="148" viewBox="0 0 852 148" role="img" aria-labelledby="title">
<title id="title">TIP: My CV/resume runs in your terminal, in a green-screen mainframe UI. npx run-cv craig. No terminal handy? Click to run it in the browser →</title>
<style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace; white-space: pre; }
  @keyframes appear { from { opacity: 0; } }
  @keyframes type { from { transform: translateX(0); } to { transform: translateX(172.79999999999998px); } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes follow { from { transform: translateX(-172.79999999999998px); } to { transform: translateX(0); } }
  .typing { animation: type 1.12s steps(16) .9s both; }
  .follow { animation: follow 1.12s steps(16) .9s both; }
  .blink { animation: blink 1s step-end infinite; }
  .note { animation: appear .4s ease-out 2.32s both; }
  @keyframes lock { 0% { opacity: 0; transform: scale(1.05); } 55% { opacity: 1; transform: scale(1); } 65% { opacity: .2; } 75% { opacity: 1; } 85% { opacity: .2; } 100% { opacity: 1; transform: scale(1); } }
  .lock { transform-box: view-box; transform-origin: 50% 50%; animation: lock .9s ease-out .1s both; }
  @media (prefers-reduced-motion: reduce) {
  * { animation: none !important; }
  .motion-only { display: none; }
}
</style>
<g transform="translate(6 6)">
  <rect width="840" height="136" fill="#f4fbf4"/>
  <text x="26" y="30" font-size="13" font-weight="700" letter-spacing="2" fill="#006d77">[ TIP ]</text>
  <line x1="106.6" y1="25.5" x2="814" y2="25.5" stroke="#d3ebd3" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="26" y="60" font-size="15" fill="#0b5d1e">My CV/resume runs in your terminal, in a green-screen mainframe UI.</text>
  <text x="26" y="94" font-size="18" fill="#3f7a4f">$</text>
  <text x="47.599999999999994" y="94" font-size="18" font-weight="700" fill="#0b5d1e" textLength="172.79999999999998" lengthAdjust="spacing">npx run-cv craig</text>
  <rect class="typing motion-only" x="47.599999999999994" y="74" width="183.6" height="28" fill="#f4fbf4"/>
  <g class="follow"><rect class="blink" x="225.8" y="80" width="10.799999999999999" height="18" fill="#0b5d1e"/></g>
  <text class="note" x="26" y="118" font-size="13" fill="#3f7a4f">No terminal handy? Click to run it in the browser →</text>
</g>
<rect x="6" y="6" width="840" height="136" fill="none" stroke="#2e7d32" stroke-width="1.5"/>
<path class="lock" d="M1.25 19.25 V1.25 H19.25 M832.75 1.25 H850.75 V19.25 M850.75 128.75 V146.75 H832.75 M19.25 146.75 H1.25 V128.75" fill="none" stroke="#0b5d1e" stroke-width="2.5" stroke-linecap="square"/>
</svg>
